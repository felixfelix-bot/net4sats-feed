name: Build and Publish net4sats Meta-Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  PACKAGE_NAME: "net4sats"

jobs:
  determine-versioning:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_channel: ${{ steps.version.outputs.release_channel }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            CHANNEL="stable"
            BASE_VERSION="${GITHUB_REF_NAME#v}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANNEL="stable"
            BASE_VERSION=$(grep -m1 'PKG_VERSION:=' Makefile | sed 's/.*PKG_VERSION:=\([^)]*\).*/\1/')
            [ -z "$BASE_VERSION" ] && BASE_VERSION="0.1.0"
          else
            CHANNEL="dev"
            BASE_VERSION="0.1.0"
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          PACKAGE_VERSION="${CHANNEL}.${BASE_VERSION}.${{ github.run_number }}.${SHORT_SHA}"
          echo "package_version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "release_channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "Version: ${PACKAGE_VERSION} (${CHANNEL})"

  build-ipk:
    needs: determine-versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build net4sats ipk
        run: |
          chmod +x build-ipk.sh
          ./build-ipk.sh "${{ needs.determine-versioning.outputs.package_version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}_${{ needs.determine-versioning.outputs.package_version }}_all.ipk
          path: "*.ipk"

  publish-blossom:
    needs: [determine-versioning, build-ipk]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.PACKAGE_NAME }}_${{ needs.determine-versioning.outputs.package_version }}_all.ipk
      - name: Publish to Blossom
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_SECRET_KEY }}
        run: |
          IPK_FILE="${PACKAGE_NAME}_${{ needs.determine-versioning.outputs.package_version }}_all.ipk"
          echo "Publishing $IPK_FILE to Blossom..."
          # TODO: Add blossom upload + NIP-94 kind:1063 event
          # Requires blossom CLI or nak + curl
      - name: Update feed index
        run: |
          echo "Feed index update would go here"
